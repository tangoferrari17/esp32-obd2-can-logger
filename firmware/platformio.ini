; ESP32 OBD-II CAN logger
;   Build + flash:   pio run -e esp32dev -t upload
;   Serial monitor:  pio device monitor -e esp32dev
;   Unit tests:      pio test -e native        (runs on your laptop, no hardware)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    autowp/autowp-mcp2515@^1.2.1
test_ignore = *

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
test_build_src = no
